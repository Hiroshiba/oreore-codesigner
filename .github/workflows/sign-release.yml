name: sign-release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 対象sourceのrepository
        required: true
        type: string
      tag:
        description: 対象sourceの固定tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signing-${{ inputs.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  acquire-source:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.acquire.outputs.owner }}
      repo: ${{ steps.acquire.outputs.repo }}
      source_sha: ${{ steps.acquire.outputs.source_sha }}
      commit_timestamp: ${{ steps.acquire.outputs.commit_timestamp }}
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: default branchからのdispatchだけを許可
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'default branch以外からのdispatchは許可されていません: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi

      - name: repositoryを検証
        id: repository
        env:
          REPOSITORY: ${{ inputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?/[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?$ ]]; then
            printf '%s\n' 'repositoryはowner/name形式でなければなりません' >&2
            exit 1
          fi
          owner=${REPOSITORY%%/*}
          repo=${REPOSITORY#*/}
          printf 'owner=%s\n' "$owner" >>"$GITHUB_OUTPUT"
          printf 'repo=%s\n' "$repo" >>"$GITHUB_OUTPUT"

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ steps.repository.outputs.owner }}
          repositories: ${{ steps.repository.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: 固定SHAのsource archiveを生成
        id: acquire
        env:
          GH_TOKEN: ${{ steps.source-app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/workflow/acquire-source.sh \
            "$REPOSITORY" \
            "$TAG" \
            "$RUNNER_TEMP/source.tar" \
            "$GITHUB_OUTPUT"

      - name: source archiveをartifact化
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-source
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/source.tar

  build-macos:
    needs: acquire-source
    runs-on: macos-14
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: source archiveを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-source
          path: ${{ runner.temp }}/source

      - name: 秘密なしsource build
        id: build
        env:
          SOURCE_SHA: ${{ needs.acquire-source.outputs.source_sha }}
          COMMIT_TIMESTAMP: ${{ needs.acquire-source.outputs.commit_timestamp }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/macos-build"
          bash scripts/workflow/build-source.sh \
            "$RUNNER_TEMP/source/source.tar" \
            "$SOURCE_SHA" \
            "$COMMIT_TIMESTAMP" \
            "$RUNNER_TEMP/macos-build/unsigned-app.tar" \
            "$RUNNER_TEMP/macos-build/package-input" \
            "$GITHUB_OUTPUT"

      - name: macOS build artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-macos-build
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/macos-build

  build-windows:
    needs: acquire-source
    runs-on: windows-2022
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: source archiveを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-source
          path: ${{ runner.temp }}/source

      - name: 秘密なしsource build
        id: build
        env:
          SOURCE_SHA: ${{ needs.acquire-source.outputs.source_sha }}
          COMMIT_TIMESTAMP: ${{ needs.acquire-source.outputs.commit_timestamp }}
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $env:RUNNER_TEMP 'windows-build'
          New-Item -ItemType Directory -Path $buildDirectory -ErrorAction Stop | Out-Null
          & "$env:GITHUB_WORKSPACE/scripts/workflow/build-source.ps1" `
            -SourceArchive (Join-Path $env:RUNNER_TEMP 'source/source.tar') `
            -SourceSha $env:SOURCE_SHA `
            -CommitTimestamp $env:COMMIT_TIMESTAMP `
            -UnsignedArchive (Join-Path $buildDirectory 'unsigned-app.tar') `
            -PackageInputDirectory (Join-Path $buildDirectory 'package-input') `
            -OutputFile $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Windows source buildに失敗しました' }

      - name: Windows build artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-windows-build
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/windows-build

  sign-macos:
    needs: build-macos
    runs-on: macos-14
    environment: macos-signing
    outputs:
      version: ${{ steps.package-input.outputs.version }}
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: macOS build artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-macos-build
          path: ${{ runner.temp }}/macos-build

      - name: package inputのversionを取得
        id: package-input
        env:
          PACKAGE_INPUT_PATH: ${{ runner.temp }}/macos-build/package-input/package-input.json
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(jq -er '.version | select(type == "string" and length > 0)' "$PACKAGE_INPUT_PATH")
          if [[ "$version" == *$'\n'* || "$version" == *$'\r'* ]]; then
            printf '%s\n' 'package inputのversionに改行を指定できません' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: macOS署名と梱包
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/workflow/sign-macos.sh \
            "$RUNNER_TEMP/macos-build/unsigned-app.tar" \
            "$RUNNER_TEMP/macos-build/package-input" \
            "$REPOSITORY" \
            "$TAG" \
            "$RUNNER_TEMP/macos-release"

      - name: macOS signed artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-macos-sign
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/macos-release

  sign-windows:
    needs: build-windows
    runs-on: windows-2022
    environment: windows-signing
    outputs:
      version: ${{ steps.package-input.outputs.version }}
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: Windows build artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-windows-build
          path: ${{ runner.temp }}/windows-build

      - name: package inputのversionを取得
        id: package-input
        shell: pwsh
        run: |
          $packageInputPath = Join-Path $env:RUNNER_TEMP 'windows-build/package-input/package-input.json'
          $version = (& jq -er '.version | select(type == "string" and length > 0)' $packageInputPath)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($version) -or $version.Contains("`n") -or $version.Contains("`r")) {
            throw 'package inputのversionが不正です'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Windows署名と梱包
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/workflow/sign-windows.ps1" `
            -UnsignedArchive (Join-Path $env:RUNNER_TEMP 'windows-build/unsigned-app.tar') `
            -PackageInputDirectory (Join-Path $env:RUNNER_TEMP 'windows-build/package-input') `
            -Repository $env:REPOSITORY `
            -Tag $env:TAG `
            -ReleaseOutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-release')
          if ($LASTEXITCODE -ne 0) { throw 'Windows signingに失敗しました' }

      - name: Windows signed artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-windows-sign
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/windows-release

  publish-release:
    needs: [acquire-source, sign-macos, sign-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: macOSとWindowsのversion一致を確認
        env:
          MACOS_VERSION: ${{ needs.sign-macos.outputs.version }}
          WINDOWS_VERSION: ${{ needs.sign-windows.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$MACOS_VERSION" || -z "$WINDOWS_VERSION" || "$MACOS_VERSION" != "$WINDOWS_VERSION" ]]; then
            printf 'macOSとWindowsのversionが一致しません: macOS=%s Windows=%s\n' "$MACOS_VERSION" "$WINDOWS_VERSION" >&2
            exit 1
          fi

      - name: macOS signed artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-macos-sign
          path: ${{ runner.temp }}/macos-release

      - name: Windows signed artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-windows-sign
          path: ${{ runner.temp }}/windows-release

      - name: 公開用App tokenを発行
        id: publish-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.acquire-source.outputs.owner }}
          repositories: ${{ needs.acquire-source.outputs.repo }}
          permission-contents: write
          skip-token-revoke: false

      - name: Releaseへassetを公開
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.acquire-source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.sign-macos.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/workflow/publish-release.sh \
            "$REPOSITORY" \
            "$TAG" \
            "$SOURCE_SHA" \
            "$EXPECTED_VERSION" \
            "$RUNNER_TEMP/macos-release" \
            "$RUNNER_TEMP/windows-release"
