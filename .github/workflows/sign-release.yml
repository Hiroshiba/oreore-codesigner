name: sign-release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 対象sourceのrepository
        required: true
        type: string
      tag:
        description: 対象sourceの固定tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signing-${{ inputs.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.repository.outputs.owner }}
      repo: ${{ steps.repository.outputs.repo }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.contract.outputs.version }}
      channel: ${{ steps.contract.outputs.channel }}
      builder_config: ${{ steps.contract.outputs.builder_config }}
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: default branchからのdispatchだけを許可
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'default branch以外からのdispatchは許可されていません: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi

      - name: 入力を検証
        id: repository
        env:
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?/[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?$ ]]; then
            printf '%s\n' 'repositoryはowner/name形式でなければなりません' >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$TAG" >/dev/null; then
            printf '%s\n' 'tagはGit refとして不正です' >&2
            exit 1
          fi
          printf 'owner=%s\nrepo=%s\n' "${REPOSITORY%%/*}" "${REPOSITORY#*/}" >>"$GITHUB_OUTPUT"

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ steps.repository.outputs.owner }}
          repositories: ${{ steps.repository.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: tagのsourceをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.tag }}
          token: ${{ steps.source-app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: source SHAを確定
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_sha=$(git -C source rev-parse --verify "refs/tags/$TAG^{commit}")
          source_sha=$(git -C source rev-parse HEAD)
          if [[ "$source_sha" != "$tag_sha" ]]; then
            printf '%s\n' 'checkoutしたsourceがtagのcommit SHAと一致しません' >&2
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'source SHAが40桁ではありません' >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"

      - name: source契約を検証
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          contract_json=$(pnpm exec tsx src/cli.ts validate-source --source-directory "$GITHUB_WORKSPACE/source")
          {
            printf 'version=%s\n' "$(jq -er '.version' <<<"$contract_json")"
            printf 'channel=%s\n' "$(jq -er '.channel' <<<"$contract_json")"
            printf 'builder_config=%s\n' "$(jq -er '.builder_config' <<<"$contract_json")"
          } >>"$GITHUB_OUTPUT"

  package-macos:
    needs: resolve-source
    runs-on: macos-14
    environment: macos-signing
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: 固定SHAのsourceをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ steps.source-app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: 公開証明書をCode Signing用途で信頼
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$GITHUB_WORKSPACE/config/certificates/macos.cer"
          security verify-cert -c "$GITHUB_WORKSPACE/config/certificates/macos.cer" -p codeSign

      - name: macOS署名と梱包
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ needs.resolve-source.outputs.version }}
          CHANNEL: ${{ needs.resolve-source.outputs.channel }}
          BUILDER_CONFIG: ${{ needs.resolve-source.outputs.builder_config }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/scripts/workflow/sign-macos.sh" \
            "$GITHUB_WORKSPACE/source" \
            "$REPOSITORY" \
            "$TAG" \
            "$RUNNER_TEMP/macos-release" \
            "$EXPECTED_VERSION" \
            "$CHANNEL" \
            "$BUILDER_CONFIG"

      - name: macOS signed artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-macos
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/macos-release

  package-windows:
    needs: resolve-source
    runs-on: windows-2022
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        shell: bash
        run: bash scripts/workflow/setup-central.sh

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: 固定SHAのsourceをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ steps.source-app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Windows署名と梱包
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ needs.resolve-source.outputs.version }}
          CHANNEL: ${{ needs.resolve-source.outputs.channel }}
          BUILDER_CONFIG: ${{ needs.resolve-source.outputs.builder_config }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/workflow/sign-windows.ps1" `
            -SourceDirectory (Join-Path $env:GITHUB_WORKSPACE 'source') `
            -Repository $env:REPOSITORY `
            -Tag $env:TAG `
            -ReleaseOutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-release') `
            -ExpectedVersion $env:EXPECTED_VERSION `
            -Channel $env:CHANNEL `
            -BuilderConfig $env:BUILDER_CONFIG
          if ($LASTEXITCODE -ne 0) { throw 'Windows packageに失敗しました' }

      - name: Windows signed artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-windows
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/windows-release

  publish-release:
    needs: [resolve-source, package-macos, package-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: macOS signed artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-macos
          path: ${{ runner.temp }}/macos-release

      - name: Windows signed artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.run_id }}-windows
          path: ${{ runner.temp }}/windows-release

      - name: 公開用App tokenを発行
        id: publish-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: write
          skip-token-revoke: false

      - name: Releaseへassetを公開
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.resolve-source.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/workflow/publish-release.sh \
            "$REPOSITORY" \
            "$TAG" \
            "$SOURCE_SHA" \
            "$EXPECTED_VERSION" \
            "$RUNNER_TEMP/macos-release" \
            "$RUNNER_TEMP/windows-release"
