name: sign-release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 対象sourceのrepository
        required: true
        type: string
      tag:
        description: 対象sourceの固定tag
        required: true
        type: string
      diagnose_macos_p12:
        description: macOS P12を診断し署名と公開を行わない
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: signing-${{ inputs.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.repository.outputs.owner }}
      repo: ${{ steps.repository.outputs.repo }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.contract.outputs.version }}
      channel: ${{ steps.contract.outputs.channel }}
      builder_config: ${{ steps.contract.outputs.builder_config }}
    steps:
      - name: 検証対象を限定
        env:
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/test/macos-signing-smoke-20260922" ||
            "$REPOSITORY" != "Hiroshiba/hiho-cli-audio" ||
            "$TAG" != "signing-test-pr13-6b2277a" ]]; then
            printf '%s\n' '検証対象のref、repository、tagが一致しません' >&2
            exit 1
          fi

      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: 入力を検証
        id: repository
        env:
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?/[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?$ ]]; then
            printf '%s\n' 'repositoryはowner/name形式でなければなりません' >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$TAG" >/dev/null; then
            printf '%s\n' 'tagはGit refとして不正です' >&2
            exit 1
          fi
          printf 'owner=%s\nrepo=%s\n' "${REPOSITORY%%/*}" "${REPOSITORY#*/}" >>"$GITHUB_OUTPUT"

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ steps.repository.outputs.owner }}
          repositories: ${{ steps.repository.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: tagのsourceをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.tag }}
          token: ${{ steps.source-app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: source SHAを確定
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_sha=$(git -C source rev-parse --verify "refs/tags/$TAG^{commit}")
          source_sha=$(git -C source rev-parse HEAD)
          if [[ "$source_sha" != "$tag_sha" ]]; then
            printf '%s\n' 'checkoutしたsourceがtagのcommit SHAと一致しません' >&2
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'source SHAが40桁ではありません' >&2
            exit 1
          fi
          if [[ "$source_sha" != "6b2277a2151a996b72fe9858b125564775989f2d" ]]; then
            printf '%s\n' 'source SHAが審査済みcommitと一致しません' >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"

      - name: source契約を検証
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          contract_json=$(pnpm exec tsx src/cli.ts validate-source --source-directory "$GITHUB_WORKSPACE/source")
          {
            printf 'version=%s\n' "$(jq -er '.version' <<<"$contract_json")"
            printf 'channel=%s\n' "$(jq -er '.channel' <<<"$contract_json")"
            printf 'builder_config=%s\n' "$(jq -er '.builder_config' <<<"$contract_json")"
          } >>"$GITHUB_OUTPUT"

  preflight-release:
    needs: resolve-source
    if: ${{ inputs.diagnose_macos_p12 != true }}
    runs-on: ubuntu-24.04
    steps:
      - name: 公開用App tokenを発行
        id: publish-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: 公開対象のdraft Releaseを検証
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/$REPOSITORY/releases/392917944" |
            jq -e --arg tag "$TAG" --arg source_sha "$SOURCE_SHA" '
              .id == 392917944 and
              .tag_name == $tag and
              .draft == true and
              .immutable == false and
              .target_commitish == $source_sha and
              (.assets | type == "array" and length == 0)
            ' >/dev/null; then
            printf '%s\n' '公開対象のdraft Releaseが固定条件と一致しません' >&2
            exit 1
          fi

  package-macos:
    needs: [resolve-source, preflight-release]
    if: ${{ inputs.diagnose_macos_p12 != true }}
    runs-on: macos-14
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: 固定SHAのsourceをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ steps.source-app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: 公開証明書をCode Signing用途で信頼
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$GITHUB_WORKSPACE/config/certificates/macos.cer"
          security verify-cert -c "$GITHUB_WORKSPACE/config/certificates/macos.cer" -p codeSign

      - name: macOS署名と梱包
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ needs.resolve-source.outputs.version }}
          CHANNEL: ${{ needs.resolve-source.outputs.channel }}
          BUILDER_CONFIG: ${{ needs.resolve-source.outputs.builder_config }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/scripts/workflow/sign-macos.sh" \
            "$GITHUB_WORKSPACE/source" \
            "$REPOSITORY" \
            "$TAG" \
            "$RUNNER_TEMP/macos-release" \
            "$EXPECTED_VERSION" \
            "$CHANNEL" \
            "$BUILDER_CONFIG"

      - name: macOS署名を検証
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP/macos-release/payload/"*.zip)
          if (( ${#archives[@]} != 1 )) || [[ ! -f "${archives[0]}" || -L "${archives[0]}" ]]; then
            printf '%s\n' '検証対象のmacOS ZIPが一意に存在しません' >&2
            exit 1
          fi
          verification_directory=$(mktemp -d "$RUNNER_TEMP/macos-signature.XXXXXX")
          trap 'rm -rf -- "$verification_directory"' EXIT
          ditto -x -k "${archives[0]}" "$verification_directory"
          apps=("$verification_directory/"*.app)
          if (( ${#apps[@]} != 1 )) || [[ ! -d "${apps[0]}" || -L "${apps[0]}" ]]; then
            printf '%s\n' '検証対象のmacOSアプリが一意に存在しません' >&2
            exit 1
          fi
          codesign --verify --deep --strict "${apps[0]}"

      - name: macOS signed artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-macos
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/macos-release

  diagnose-macos-p12:
    needs: resolve-source
    if: ${{ inputs.diagnose_macos_p12 == true }}
    runs-on: macos-14
    steps:
      - name: 検証対象を限定
        env:
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/test/macos-signing-smoke-20260922" ||
            "$REPOSITORY" != "Hiroshiba/hiho-cli-audio" ||
            "$TAG" != "signing-test-pr13-6b2277a" ||
            "$SOURCE_SHA" != "6b2277a2151a996b72fe9858b125564775989f2d" ]]; then
            printf '%s\n' 'P12_TARGET_REJECTED' >&2
            exit 1
          fi

      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: P12を段階別に診断
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          if ! work_directory=$(mktemp -d "$RUNNER_TEMP/macos-p12-diagnostic.XXXXXX" 2>/dev/null); then
            printf '%s\n' 'P12_SETUP_FAILED' >&2
            exit 1
          fi
          keychain="$work_directory/diagnostic.keychain-db"
          cleanup() {
            local status=$?
            local cleanup_status=0
            trap - EXIT
            unset CSC_LINK CSC_KEY_PASSWORD password keychain_password
            if [[ -e "$keychain" ]] && ! security delete-keychain "$keychain" >/dev/null 2>&1; then
              cleanup_status=1
            fi
            if ! rm -rf -- "$work_directory" >/dev/null 2>&1; then
              cleanup_status=1
            fi
            if (( cleanup_status != 0 )); then
              printf '%s\n' 'P12_CLEANUP_FAILED' >&2
              exit 1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          p12_path="$work_directory/certificate.p12"
          password_path="$work_directory/password"
          if ! node - "$p12_path" "$password_path" >/dev/null 2>&1 <<'NODE'
          const fs = require('node:fs');
          const link = process.env.CSC_LINK;
          const password = process.env.CSC_KEY_PASSWORD;
          if (link === undefined || password === undefined) process.exit(1);
          const trimmedLink = link.trim();
          const trimmedPassword = password.trim();
          const p12 = Buffer.from(trimmedLink, 'base64');
          if (p12.byteLength === 0 || trimmedPassword === '') process.exit(1);
          fs.writeFileSync(process.argv[2], p12, { mode: 0o600 });
          fs.writeFileSync(process.argv[3], trimmedPassword, { mode: 0o600 });
          NODE
          then
            printf '%s\n' 'P12_DECODE_FAILED' >&2
            exit 1
          fi
          printf '%s\n' 'P12_DECODE_OK'
          password=$(<"$password_path")

          if ! openssl pkcs12 -in "$p12_path" -noout -passin fd:3 3<<<"$password" >/dev/null 2>&1; then
            printf '%s\n' 'P12_PARSE_FAILED' >&2
            exit 1
          fi
          printf '%s\n' 'P12_PARSE_OK'

          private_public_path="$work_directory/private-public.der"
          certificate_public_path="$work_directory/certificate-public.der"
          certificate_pem_path="$work_directory/certificate.pem"
          if ! openssl pkcs12 -in "$p12_path" -nocerts -nodes -passin fd:3 3<<<"$password" 2>/dev/null |
            openssl pkey -pubout -outform DER -out "$private_public_path" >/dev/null 2>&1; then
            printf '%s\n' 'P12_KEY_CERT_FAILED' >&2
            exit 1
          fi
          if ! openssl pkcs12 -in "$p12_path" -clcerts -nokeys -out "$certificate_pem_path" -passin fd:3 3<<<"$password" >/dev/null 2>&1 ||
            ! openssl x509 -in "$certificate_pem_path" -pubkey -noout 2>/dev/null |
              openssl pkey -pubin -outform DER -out "$certificate_public_path" >/dev/null 2>&1 ||
            ! cmp -s "$private_public_path" "$certificate_public_path"; then
            printf '%s\n' 'P12_KEY_CERT_FAILED' >&2
            exit 1
          fi
          printf '%s\n' 'P12_KEY_CERT_OK'

          certificate_der_path="$work_directory/certificate.cer"
          if ! openssl x509 -in "$certificate_pem_path" -outform DER -out "$certificate_der_path" >/dev/null 2>&1 ||
            ! cmp -s "$certificate_der_path" "$GITHUB_WORKSPACE/config/certificates/macos.cer"; then
            printf '%s\n' 'P12_PUBLIC_CER_FAILED' >&2
            exit 1
          fi
          printf '%s\n' 'P12_PUBLIC_CER_OK'

          if ! keychain_password=$(openssl rand -hex 32 2>/dev/null) ||
            ! security create-keychain -p "$keychain_password" "$keychain" >/dev/null 2>&1 ||
            ! security unlock-keychain -p "$keychain_password" "$keychain" >/dev/null 2>&1 ||
            ! security import "$p12_path" -k "$keychain" -P "$password" -T /usr/bin/codesign >/dev/null 2>&1; then
            printf '%s\n' 'P12_KEYCHAIN_IMPORT_FAILED' >&2
            exit 1
          fi
          printf '%s\n' 'P12_KEYCHAIN_IMPORT_OK'

  package-windows:
    needs: [resolve-source, preflight-release]
    if: ${{ inputs.diagnose_macos_p12 != true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/macos-signing-smoke-20260922') }}
    runs-on: windows-2022
    environment: windows-signing
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        shell: bash
        run: bash scripts/workflow/setup-central.sh

      - name: source取得用App tokenを発行
        id: source-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: read
          skip-token-revoke: false

      - name: 固定SHAのsourceをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ steps.source-app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Windows署名と梱包
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ needs.resolve-source.outputs.version }}
          CHANNEL: ${{ needs.resolve-source.outputs.channel }}
          BUILDER_CONFIG: ${{ needs.resolve-source.outputs.builder_config }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/workflow/sign-windows.ps1" `
            -SourceDirectory (Join-Path $env:GITHUB_WORKSPACE 'source') `
            -Repository $env:REPOSITORY `
            -Tag $env:TAG `
            -ReleaseOutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-release') `
            -ExpectedVersion $env:EXPECTED_VERSION `
            -Channel $env:CHANNEL `
            -BuilderConfig $env:BUILDER_CONFIG
          if ($LASTEXITCODE -ne 0) { throw 'Windows packageに失敗しました' }

      - name: Windows signed artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-windows
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/windows-release

  publish-release:
    needs: [resolve-source, package-macos, package-windows]
    if: ${{ inputs.diagnose_macos_p12 != true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/macos-signing-smoke-20260922') }}
    runs-on: ubuntu-24.04
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: macOS signed artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c809
        with:
          name: release-${{ github.run_id }}-macos
          path: ${{ runner.temp }}/macos-release

      - name: Windows signed artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c809
        with:
          name: release-${{ github.run_id }}-windows
          path: ${{ runner.temp }}/windows-release

      - name: 公開用App tokenを発行
        id: publish-app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ vars.SIGNING_APP_ID }}
          private-key: ${{ secrets.SIGNING_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-source.outputs.owner }}
          repositories: ${{ needs.resolve-source.outputs.repo }}
          permission-contents: write
          skip-token-revoke: false

      - name: 公開直前にdraft Releaseを再検証
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/$REPOSITORY/releases/392917944" |
            jq -e --arg tag "$TAG" --arg source_sha "$SOURCE_SHA" '
              .id == 392917944 and
              .tag_name == $tag and
              .draft == true and
              .immutable == false and
              .target_commitish == $source_sha and
              (.assets | type == "array" and length == 0)
            ' >/dev/null; then
            printf '%s\n' '公開対象のdraft Releaseが固定条件と一致しません' >&2
            exit 1
          fi

      - name: Releaseへassetを公開
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.resolve-source.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/workflow/publish-release.sh \
            "$REPOSITORY" \
            "$TAG" \
            "$SOURCE_SHA" \
            "$EXPECTED_VERSION" \
            "$RUNNER_TEMP/macos-release" \
            "$RUNNER_TEMP/windows-release"
