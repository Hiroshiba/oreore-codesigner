name: verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: 中央setup
        run: bash scripts/workflow/setup-central.sh

      - name: formatを検証
        run: pnpm format:check

      - name: lintを検証
        run: pnpm lint

      - name: typecheckを検証
        run: pnpm typecheck

      - name: workflowとactionを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          actionlint_version=1.7.12
          actionlint_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          actionlint_root="$RUNNER_TEMP/actionlint-$actionlint_version"
          actionlint_archive="$actionlint_root/actionlint.tar.gz"
          actionlint_binary="$actionlint_root/actionlint"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v$actionlint_version/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          mkdir -p "$actionlint_root"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --output "$actionlint_archive" "$actionlint_url"
          printf '%s  %s\n' "$actionlint_sha256" "$actionlint_archive" | sha256sum --check --status -
          tar --extract --gzip --file="$actionlint_archive" --directory="$actionlint_root"
          chmod 0755 "$actionlint_binary"
          "$actionlint_binary" -color=false .github/workflows/*.yml

      - name: shell scriptを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          shell_file_count=0
          while IFS= read -r -d '' file; do
            shell_file_count=$((shell_file_count + 1))
            bash -n "$file"
            shellcheck --shell=bash "$file"
          done < <(find scripts experimental -type f -name '*.sh' -print0)
          if (( shell_file_count == 0 )); then
            printf '%s\n' '検証対象のshell scriptがありません' >&2
            exit 1
          fi

      - name: PowerShell parserを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            printf '%s\n' 'pwshが見つかりません' >&2
            exit 1
          fi
          powershell_file_count=0
          while IFS= read -r -d '' file; do
            powershell_file_count=$((powershell_file_count + 1))
            CENTRAL_VERIFY_PS_PATH="$file" pwsh -NoProfile -NonInteractive -Command "
              \$path = [Environment]::GetEnvironmentVariable(\"CENTRAL_VERIFY_PS_PATH\")
              \$tokens = \$null
              \$errors = \$null
              [System.Management.Automation.Language.Parser]::ParseFile(\$path, [ref]\$tokens, [ref]\$errors) | Out-Null
              if (\$null -ne \$errors -and \$errors.Count -gt 0) {
                foreach (\$parseError in \$errors) {
                  \"{0}:{1}:{2}: {3}\" -f \$path, \$parseError.Extent.StartLineNumber, \$parseError.Extent.StartColumnNumber, \$parseError.Message
                }
                exit 1
              }
            "
          done < <(find scripts -type f -name '*.ps1' -print0)
          if (( powershell_file_count == 0 )); then
            printf '%s\n' '検証対象のPowerShell scriptがありません' >&2
            exit 1
          fi
