name: verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CENTRAL_NODE_VERSION: 22.14.0
  CENTRAL_PNPM_VERSION: 10.30.2

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: 中央repoをcheckout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Nodeを設定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: pnpmを固定してinstall
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare "pnpm@$CENTRAL_PNPM_VERSION" --activate
          [[ "$(pnpm --version)" == "$CENTRAL_PNPM_VERSION" ]]
          pnpm install --frozen-lockfile

      - name: formatを検証
        run: pnpm format:check

      - name: lintを検証
        run: pnpm lint

      - name: typecheckを検証
        run: pnpm typecheck

      - name: testを検証
        run: pnpm test

      - name: workflow fixtureを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 scripts/workflow/test_workflow.py

      - name: workflowとactionを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          actionlint_version=1.7.12
          actionlint_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          actionlint_root="$RUNNER_TEMP/actionlint-$actionlint_version"
          actionlint_archive="$actionlint_root/actionlint.tar.gz"
          actionlint_binary="$actionlint_root/actionlint"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v$actionlint_version/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          mkdir -p "$actionlint_root"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --output "$actionlint_archive" "$actionlint_url"
          printf '%s  %s\n' "$actionlint_sha256" "$actionlint_archive" | sha256sum --check --status -
          tar --extract --gzip --file="$actionlint_archive" --directory="$actionlint_root"
          chmod 0755 "$actionlint_binary"
          [[ "$("$actionlint_binary" -version | sed -n '1p')" == "$actionlint_version" ]]
          workflow_files_path="$RUNNER_TEMP/verify-workflow-files.nul"
          workflow_find_status=0
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 > "$workflow_files_path" || workflow_find_status=$?
          if (( workflow_find_status != 0 )); then
            printf 'workflowファイルの列挙に失敗しました\n' >&2
            exit "$workflow_find_status"
          fi
          mapfile -d '' workflow_files < "$workflow_files_path"
          if (( ${#workflow_files[@]} == 0 )); then
            printf 'workflowファイルがありません\n' >&2
            exit 1
          fi
          "$actionlint_binary" -color=false "${workflow_files[@]}"
          uses_files_path="$RUNNER_TEMP/verify-uses-files.nul"
          uses_lines_path="$RUNNER_TEMP/verify-uses-lines"
          uses_find_status=0
          find .github -type f -name '*.yml' -print0 > "$uses_files_path" || uses_find_status=$?
          if (( uses_find_status != 0 )); then
            printf 'actionの検査対象ファイルの列挙に失敗しました\n' >&2
            exit "$uses_find_status"
          fi
          : > "$uses_lines_path"
          uses_file_count=0
          while IFS= read -r -d '' file; do
            uses_file_count=$((uses_file_count + 1))
            grep_status=0
            grep -E -h '^[[:space:]]*uses:' "$file" >> "$uses_lines_path" || grep_status=$?
            if (( grep_status > 1 )); then
              printf 'actionの検査に失敗しました: %s\n' "$file" >&2
              exit "$grep_status"
            fi
          done < "$uses_files_path"
          if (( uses_file_count == 0 )); then
            printf 'actionの検査対象ファイルがありません\n' >&2
            exit 1
          fi
          while IFS= read -r line; do
            if [[ ! "$line" =~ uses:[[:space:]][^@[:space:]]+@[0-9A-Fa-f]{40}([[:space:]]|$) ]]; then
              printf '40桁SHAで固定されていないactionがあります: %s\n' "$line" >&2
              exit 1
            fi
          done < "$uses_lines_path"

      - name: shell scriptを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          shell_files_path="$RUNNER_TEMP/verify-shell-files.nul"
          shell_find_status=0
          find scripts/workflow -type f -name '*.sh' -print0 > "$shell_files_path" || shell_find_status=$?
          if (( shell_find_status != 0 )); then
            printf 'shell scriptの列挙に失敗しました\n' >&2
            exit "$shell_find_status"
          fi
          mapfile -d '' files < "$shell_files_path"
          if (( ${#files[@]} == 0 )); then
            printf '検証対象のshell scriptがありません\n' >&2
            exit 1
          fi
          bash -n "${files[@]}"
          shellcheck --shell=bash "${files[@]}"

      - name: PowerShell parserを検証
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            powershell_files_path="$RUNNER_TEMP/verify-powershell-files.nul"
            powershell_find_status=0
            find scripts/workflow -type f -name '*.ps1' -print0 > "$powershell_files_path" || powershell_find_status=$?
            if (( powershell_find_status != 0 )); then
              printf 'PowerShell scriptの列挙に失敗しました\n' >&2
              exit "$powershell_find_status"
            fi
            mapfile -d '' powershell_files < "$powershell_files_path"
            if (( ${#powershell_files[@]} == 0 )); then
              printf '検証対象のPowerShell scriptがありません\n' >&2
              exit 1
            fi
            for file in "${powershell_files[@]}"; do
              pwsh -NoProfile -NonInteractive -Command "\$tokens = \$null; \$errors = \$null; [System.Management.Automation.Language.Parser]::ParseFile(\$args[0], [ref]\$tokens, [ref]\$errors) | Out-Null; if (\$errors.Count -gt 0) { \$errors | ForEach-Object { \$_.ToString() }; exit 1 }" "$file"
            done
          fi
